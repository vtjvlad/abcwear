<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров | ABC Wear</title>
    <meta name="description" content="Каталог модной одежды ABC Wear. Большой выбор платьев, брюк, юбок и других предметов гардероба.">
    <meta name="keywords" content="одежда, мода, каталог, платья, брюки, юбки, ABC Wear">
    
    <!-- Open Graph теги -->
    <meta property="og:title" content="Каталог товаров | ABC Wear">
    <meta property="og:description" content="Каталог модной одежды ABC Wear. Большой выбор платьев, брюк, юбок и других предметов гардероба.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://abcwear.ru/catalog">
    <meta property="og:image" content="https://abcwear.ru/images/og-catalog.jpg">
    
    <!-- Каноническая ссылка -->
    <link rel="canonical" href="https://abcwear.ru/catalog">
    
    <!-- Стили -->
    <link rel="stylesheet" href="/styles/catalog.css">
    
    <!-- Скрипты -->
    <script src="/js/seo-filters.js" defer></script>
    <script src="/js/catalog.js" defer></script>
</head>
<body>
    <div class="catalog-container">
        <!-- Боковая панель с фильтрами -->
        <aside class="filters-sidebar">
            <div class="filters-header">
                <h2>Фильтры</h2>
                <button class="clear-filters-btn">Очистить все</button>
            </div>
            
            <!-- Категории -->
            <div class="filter-section">
                <h3>Категории</h3>
                <div class="filter-list">
                    <label>
                        <input type="checkbox" class="category-filter" value="platya">
                        Платья
                    </label>
                    <label>
                        <input type="checkbox" class="category-filter" value="bryuki">
                        Брюки
                    </label>
                    <label>
                        <input type="checkbox" class="category-filter" value="yubki">
                        Юбки
                    </label>
                    <label>
                        <input type="checkbox" class="category-filter" value="bluzki">
                        Блузки
                    </label>
                    <label>
                        <input type="checkbox" class="category-filter" value="verhnyaya-odezhda">
                        Верхняя одежда
                    </label>
                </div>
            </div>
            
            <!-- Цвета -->
            <div class="filter-section">
                <h3>Цвета</h3>
                <div class="filter-list">
                    <label>
                        <input type="checkbox" class="color-filter" value="chernyy">
                        Черный
                    </label>
                    <label>
                        <input type="checkbox" class="color-filter" value="belyy">
                        Белый
                    </label>
                    <label>
                        <input type="checkbox" class="color-filter" value="krasnyy">
                        Красный
                    </label>
                    <label>
                        <input type="checkbox" class="color-filter" value="siniy">
                        Синий
                    </label>
                    <label>
                        <input type="checkbox" class="color-filter" value="zelenyy">
                        Зеленый
                    </label>
                </div>
            </div>
            
            <!-- Цена -->
            <div class="filter-section">
                <h3>Цена</h3>
                <div class="price-range">
                    <div class="price-inputs">
                        <input type="number" class="min-price" placeholder="От">
                        <span>-</span>
                        <input type="number" class="max-price" placeholder="До">
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- Основной контент -->
        <main class="catalog-content">
            <!-- Хлебные крошки -->
            <div class="breadcrumbs">
                <a href="/">Главная</a> / Каталог
            </div>
            
            <!-- Заголовок и поиск -->
            <div class="catalog-header">
                <h1>Каталог товаров</h1>
                <div class="products-count">Найдено товаров: 0</div>
            </div>
            
            <!-- Поиск и сортировка -->
            <div class="search-sort">
                <input type="text" class="search-input" placeholder="Поиск товаров...">
                <select class="sort-select">
                    <option value="default">По умолчанию</option>
                    <option value="price-asc">По возрастанию цены</option>
                    <option value="price-desc">По убыванию цены</option>
                    <option value="name-asc">По названию (А-Я)</option>
                    <option value="name-desc">По названию (Я-А)</option>
                </select>
            </div>
            
            <!-- Сетка товаров -->
            <div class="products-grid">
                <!-- Товары будут добавлены динамически -->
            </div>
            
            <!-- Пагинация -->
            <div class="pagination">
                <!-- Пагинация будет добавлена динамически -->
            </div>
        </main>
    </div>
</body>
</html>
